# Slot.y is already mutable -- NeoForge itself widens it, and Refined Storage's own
# Platform.setSlotY is a plain write to it, which is how the Pattern Grid scrolls its
# processing matrix. Slot.x was left final only because nothing upstream needed it.
#
# The fluid substitution layout centres one input, an arrow and two outputs inside the
# same 130x54 inset, which means moving slots horizontally as well as vertically. Without
# this the layout has to reuse Refined Storage's fixed columns, which would put the input
# in container slot 1 and leave slot 0 parked and invisible -- a slot the fill logic would
# still write to.
public-f net.minecraft.world.inventory.Slot x
