org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
# NeoGradle 7 does not support Gradle's configuration cache; leave this off.
org.gradle.configuration-cache=false

# Parchment gives readable parameter names on decompiled Minecraft sources.
neogradle.subsystems.parchment.minecraftVersion=1.21.1
neogradle.subsystems.parchment.mappingsVersion=2024.11.17

## Environment - these MUST match the ATM10 instance we are profiling against.
## Instance: D:\Minecraft Instances\All the Mods 10 - ATM10(1)
## Read from its mmc-pack.json: MC 1.21.1, NeoForge 21.1.234.
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.234
loader_version_range=[1,)

## Refined Storage - the mod we are optimizing.
## The instance ships BOTH 2.0.8 and 2.0.9; FML resolves the duplicate modid to
## the newest, and the log confirms "Refined Storage 2.0.9 (refinedstorage)" is
## what actually loads. We compile against the exact jar copied into libs/ so
## mixin targets can never drift from the running bytecode.
refined_storage_version=2.0.9

## Mod Properties
mod_id=rstweaks
mod_name=Refined Storage Tweaks
mod_license=All Rights Reserved
# Bump the patch digit on every build handed over for testing. The version is read at
# runtime from the jar metadata and printed in the startup log and the chat join
# message, so any test result can be tied to an exact build -- we have twice been misled
# by not knowing which jar was running.
#
# >> WHEN YOU CHANGE THIS LINE, ADD AN ENTRY TO BOTH VERSIONS.txt AND CHANGELOG.md. <<
#
# VERSIONS.txt is the one or two line summary. CHANGELOG.md is the detailed history and
# carries the reasoning -- why, not just what. Both, every time, in the same change.
#
# Do it in the same change as the bump, not later: 0.2.18 through 0.2.46 were never
# written down and that stretch is unrecoverable detail. Both files exist so that never
# happens again.
mod_version=0.9.1
mod_group_id=com.wraithhawit.rstweaks
