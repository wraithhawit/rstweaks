plugins {
    id 'java-library'
    id 'net.neoforged.gradle.userdev' version '7.1.38'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// Mojang ships Java 21 for 1.21.1.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenCentral()
}

// Runs the planner suite in a plain JVM, so a planner change can be checked without
// restarting Minecraft. Uses the real runtime classpath because Config touches
// NeoForge's ModConfigSpec, which drags in FML, night-config and Guava.
tasks.register('plannerCheck', JavaExec) {
    group = 'verification'
    description = 'Runs the LP planner self-tests headlessly.'
    // Refined Storage is compileOnly, so the runtime classpath alone is not enough.
    classpath = sourceSets.main.runtimeClasspath + sourceSets.main.compileClasspath
    mainClass = 'com.wraithhawit.rstweaks.test.HeadlessPlannerCheck'
}

// Wired into `check` (and so into `build`) unlike plannerCheck, which needs Refined Storage
// on the classpath and takes seconds. This one touches nothing but our own arithmetic and
// runs instantly, so there is no reason for it to be opt-in.
tasks.register('backoffCheck', JavaExec) {
    group = 'verification'
    description = 'Runs the Step Requester backoff policy self-tests headlessly.'
    classpath = sourceSets.main.runtimeClasspath + sourceSets.main.compileClasspath
    mainClass = 'com.wraithhawit.rstweaks.test.HeadlessBackoffCheck'
}

tasks.register('patternOrderCheck', JavaExec) {
    group = 'verification'
    description = 'Runs the pattern search-order self-tests headlessly.'
    classpath = sourceSets.main.runtimeClasspath + sourceSets.main.compileClasspath
    mainClass = 'com.wraithhawit.rstweaks.test.HeadlessPatternOrderCheck'
}

tasks.register('traceCheck', JavaExec) {
    group = 'verification'
    description = 'Runs the slow-calculation trace self-tests headlessly.'
    classpath = sourceSets.main.runtimeClasspath + sourceSets.main.compileClasspath
    mainClass = 'com.wraithhawit.rstweaks.test.HeadlessTraceCheck'
}

tasks.register('gateCheck', JavaExec) {
    group = 'verification'
    description = 'Runs the upstream-supersession version-gate self-tests headlessly.'
    classpath = sourceSets.main.runtimeClasspath + sourceSets.main.compileClasspath
    mainClass = 'com.wraithhawit.rstweaks.test.HeadlessGateCheck'
}

// The ledger model's arithmetic: slots with fates, pools, and `initial + produced - consumed
// == final`. Wired into `check` because the package it exercises holds no Minecraft types and
// the whole suite, two thousand random plans included, runs in well under a second.
tasks.register('ledgerCheck', JavaExec) {
    group = 'verification'
    description = 'Runs the ledger model and pattern-inference self-tests headlessly.'
    classpath = sourceSets.main.runtimeClasspath + sourceSets.main.compileClasspath
    mainClass = 'com.wraithhawit.rstweaks.test.HeadlessLedgerCheck'
}

// Phase 04 of the ledger model: turning solved flows into an order every step of which is
// affordable when it runs. Pure arithmetic, no Minecraft, microseconds.
tasks.register('schedulerCheck', JavaExec) {
    group = 'verification'
    description = 'Runs the execution-order self-tests headlessly.'
    classpath = sourceSets.main.runtimeClasspath + sourceSets.main.compileClasspath
    mainClass = 'com.wraithhawit.rstweaks.test.HeadlessSchedulerCheck'
}

tasks.named('check') {
    dependsOn 'backoffCheck', 'patternOrderCheck', 'traceCheck', 'gateCheck', 'ledgerCheck',
        'schedulerCheck'
}

tasks.register('sparkProfile', JavaExec) {
    group = 'verification'
    description = 'Decodes a spark profile: ./gradlew sparkProfile --args="<url|code|file>"'
    classpath = sourceSets.main.runtimeClasspath + sourceSets.main.compileClasspath
    mainClass = 'com.wraithhawit.rstweaks.test.SparkProfile'
    // Stack traces in a busy profile are deep, and the decoder recurses with them.
    jvmArgs = ['-Xss512m']
}

// Companion to sparkProfile. Spark says which code owns the tick; Observable says which
// objects do, with a count and a position each -- which is the half you can act on.
tasks.register('observableProfile', JavaExec) {
    group = 'verification'
    description = 'Decodes an Observable profile: ./gradlew observableProfile --args="<url|id|file>"'
    classpath = sourceSets.main.runtimeClasspath + sourceSets.main.compileClasspath
    mainClass = 'com.wraithhawit.rstweaks.test.ObservableProfile'
}

minecraft {
    accessTransformers {
        file('src/main/resources/META-INF/accesstransformer.cfg')
    }
}

// Refined Storage is compileOnly, so nothing puts it on a run's classpath and a dev
// launch would come up without the mod every one of our mixins targets. FML's
// mods-folder locator reads <runDirectory>/mods in dev exactly as it does in a real
// instance, so staging the jar there is all that is needed.
//
// Only Refined Storage itself, deliberately: the rest of libs/ is optional to us and
// two of them (the Mekanism integration, ExtraStorage) pull in mods that are not
// present, which would fail the whole launch for mixins we are not testing.
// libs/ is gitignored -- it is somebody else's code and this repository is public, so a
// fresh clone has none of it. Checked in a task of its own rather than in the Sync below:
// Gradle skips a copy task whose source is empty as NO-SOURCE, so a doFirst on it never
// runs, and the launch proceeds without Refined Storage and fails with a wall of FML
// output about a missing dependency that says nothing about what to do next.
tasks.register('requireRefinedStorageJar') {
    group = 'build setup'
    description = 'Fails with something readable when libs/ has no Refined Storage.'
    doLast {
        if (fileTree(dir: 'libs', include: ['refinedstorage-neoforge-*.jar']).empty) {
            throw new GradleException(
                "No refinedstorage-neoforge-*.jar in libs/, so this run would start "
                    + "without the mod every mixin targets.\n"
                    + "Copy Refined Storage 2.0.9 out of a Minecraft instance's mods "
                    + "folder into ${projectDir}/libs/ and try again. See SETUP.md.")
        }
    }
}

def stageMods(final String runName) {
    return tasks.register("stage${runName.capitalize()}Mods", Sync) {
        group = 'build setup'
        description = "Puts Refined Storage in the ${runName} run's mods folder."
        // By name, not by the task provider: this is a Groovy script method, and a
        // script-level `def` variable is not in scope inside one.
        dependsOn 'requireRefinedStorageJar'
        from fileTree(dir: 'libs', include: ['refinedstorage-neoforge-*.jar'])
        into layout.projectDirectory.dir("run/${runName}/mods")
    }
}

runs {
    configureEach {
        systemProperty 'forge.logging.markers', 'REGISTRIES'
        systemProperty 'forge.logging.console.level', 'debug'
        // Make mixin failures loud and fatal in dev instead of silently no-op'ing.
        systemProperty 'mixin.debug.export', 'true'
        systemProperty 'mixin.debug.verbose', 'true'
        workingDirectory project.layout.projectDirectory.dir('run').dir(name)
        modSource project.sourceSets.main
    }

    client {}
    server { argument '--nogui' }

    // ./gradlew runGameTestServer — boots a dedicated server, runs every @GameTest in
    // the rstweaks namespace and exits non-zero if any fail. This is the whole point of
    // issue #2: the paths below only misbehave with our mixins applied, which no plain
    // JVM run can reproduce, and until this existed checking them meant a human
    // launching Minecraft by hand.
    gameTestServer {
        systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        // The gametests build their own storages and tasks in memory; console spam from
        // a full RS debug log buries the one line that says which scenario diverged.
        systemProperty 'forge.logging.console.level', 'info'
    }
}

// tasks.matching rather than tasks.named: NeoGradle creates the run tasks during its
// own afterEvaluate, so they do not exist yet at this point in the script.
['client', 'server', 'gameTestServer'].each { runName ->
    final stage = stageMods(runName)
    tasks.matching { it.name == "run${runName.capitalize()}" }.configureEach {
        dependsOn stage
    }
}

dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"

    // Refined Storage and its addons, taken byte-for-byte from the ATM10
    // instance we profile against. Deliberately local files rather than
    // CurseForge maven coordinates: mixin targets are matched by exact method
    // descriptor, so the jars we compile against must be the identical builds
    // the game loads. If the pack updates any of them, drop the new jar in
    // libs/ and re-verify every mixin that touches it.
    //
    // compileOnly because the pack supplies all of these at runtime; we must
    // never bundle or shade them.
    //
    // Contents of libs/ (all confirmed to declare a `refinedstorage`
    // dependency in their own manifest, except EdivadLib which is
    // ExtraStorage's support library):
    //   refinedstorage-neoforge-2.0.9              the core
    //   cabletiers-neoforge-1.21.1-0.6.13          tiered cables/importers/exporters
    //   stepcrafter-neoforge-1.21.1-0.1.5          autocrafting addon
    //   ExtraDisks-1.21.1-4.0.15                   higher-capacity disks
    //   ExtraStorage-1.21.1-5.0.9                  higher-capacity storage blocks
    //   refined-types-1.21.1-0.3.2                 shared type layer (cabletiers dep)
    //   rspolymorph-neoforge-1.21.1-1.2.0          recipe conflict resolution
    //   universalgrid-neoforge-1.21.1-0.3.2        grid addon
    //   refinedstorage-quartz-arsenal-neoforge-1.0.8
    //   refinedstorage-mekanism-integration-1.1.1
    //   EdivadLib-1.21-3.0.0                       ExtraStorage/DimStorage support lib
    //
    // Mekanism is the one entry here that is not a Refined Storage addon. It is on the
    // classpath for mekanism.api alone -- IQIOComponent and IQIOFrequency, for the QIO
    // external storage provider -- so unlike the rest it is not tied to a build: any
    // 10.x jar out of the pack will compile this.
    //   Mekanism-1.21.1-10.7.19.85
    compileOnly fileTree(dir: 'libs', include: ['*.jar'])
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// ============================================================================
// Mutation testing spike. Scoped to com.wraithhawit.rstweaks.gate for now.
//
// PIT needs a JUnit suite: it re-runs tests against mutated bytecode and needs
// per-test coverage to know which tests to re-run for a given mutant. The
// Headless*Check mains cannot serve -- they aggregate failures and System.exit,
// which would kill PIT's minion JVM. So src/test carries a JUnit transcription
// of the scenarios, and the gradle *Check tasks stay exactly as they were.
// ============================================================================
configurations {
    pitest
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    // Same compileOnly jars main gets; the tests touch Refined Storage types.
    // On the test RUNTIME classpath, not just compile: PIT actually executes the planner
    // suite, and PlannerExecutabilitySelfTest builds real Refined Storage resources.
    testImplementation fileTree(dir: 'libs', include: ['*.jar'])

    pitest 'org.pitest:pitest-command-line:1.17.4'
    pitest 'org.pitest:pitest-junit5-plugin:1.2.1'
    // The junit5 plugin pulls JUnit Platform 1.9.2, and PIT prepends its own launch
    // classpath ahead of the code-under-test one. The minion then loads 1.9.2's
    // ReflectionUtils under Jupiter 5.11's engine and dies on NoSuchMethodError
    // (returnsPrimitiveVoid). Naming the platform here lets Gradle's conflict
    // resolution bump the whole configuration to the version the tests compile against.
    pitest 'org.junit.platform:junit-platform-launcher:1.11.4'
    pitest 'org.junit.platform:junit-platform-commons:1.11.4'
    pitest 'org.junit.platform:junit-platform-engine:1.11.4'
}

tasks.named('test') {
    useJUnitPlatform()
    testLogging { events 'passed', 'failed', 'skipped' }
}

// Deliberately NOT wired into `check`. A mutation score is a tool for investigating one class,
// not a gate: it is slow, and a meaningful share of surviving mutants are provably equivalent
// (a `> 0` on a branch already guarded by `!= 0`; a `>=` that assigns the same value it read),
// so a threshold would fail builds for changes that are correct. Run it when you touch a
// pure-logic class, read the survivors, and do not chase the number.
tasks.register('mutationTest', JavaExec) {
    group = 'verification'
    description = 'Runs PIT over the pure-logic packages against the JUnit suite.'
    dependsOn 'testClasses'
    mainClass = 'org.pitest.mutationtest.commandline.MutationCoverageReport'
    classpath = configurations.pitest

    // PIT takes the code-under-test classpath as an argument, not as its own.
    doFirst {
        final underTest = sourceSets.test.runtimeClasspath.files.collect { it.absolutePath }
        args = [
            '--classPath', underTest.join(','),
            '--targetClasses', (project.findProperty('pitTarget') ?: 'com.wraithhawit.rstweaks.planner.*'),
            // Without this PIT mutates the JUnit classes too -- every "removed call to
            // Assertions::assertTrue" survives trivially and drowns the real survivors.
            '--excludedClasses', 'com.wraithhawit.rstweaks.*.*Test',
            '--targetTests', 'com.wraithhawit.rstweaks.*.*Test',
            // The hand-rolled Headless*Check/SelfTest suites live in ...rstweaks.test and
            // match that glob too. PIT loads every candidate test class to scan it, and
            // those touch Minecraft and Refined Storage types, which kills the minion.
            '--excludedTestClasses', 'com.wraithhawit.rstweaks.test.*',
            '--sourceDirs', "${projectDir}/src/main/java",
            '--reportDir', "${buildDir}/reports/pitest",
            '--outputFormats', 'HTML,XML',
            '--timestampedReports', 'false',
            '--threads', '4',

        ]
    }
}
